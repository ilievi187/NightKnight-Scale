name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux format, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libssl-dev libwayland-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libsdl2-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Test headless validation safety and argument planning
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  android:
    name: Android TV build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Run Android unit tests and assemble debug APK
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug
      - name: Print debug APK SHA-256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for manual TV testing
        uses: actions/upload-artifact@v7
        with:
          name: nightknight-scale-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-tv-emulator:
    name: Android TV emulator GLES and remote smoke
    runs-on: ubuntu-24.04
    needs: android
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested debug APK
        uses: actions/download-artifact@v8
        with:
          name: nightknight-scale-tv-debug-apk
          path: ci-artifact
      - name: Enable KVM for the x86 TV AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install FFmpeg for emulator screenshot comparison
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Launch Android TV 1080p emulator and run GLES/remote smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader
          script: bash android/scripts/tv-emulator-smoke.sh ci-artifact/app-debug.apk "$RUNNER_TEMP/nkscale-tv-emulator-smoke"
      - name: Upload emulator screenshots and Logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nkscale-tv-emulator-smoke
          path: ${{ runner.temp }}/nkscale-tv-emulator-smoke/
          if-no-files-found: warn
          retention-days: 7
