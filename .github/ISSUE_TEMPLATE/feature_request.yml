---
name: Feature request
about: Propose a user-facing improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gamescope launch mode
        - Native Vulkan renderer
        - Portal/PipeWire capture
        - UI and profiles
        - Packaging
        - Other
